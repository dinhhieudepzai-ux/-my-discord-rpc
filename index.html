<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaRPC Manager Clone</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 650px; }
        .card {
            background-color: #131826;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #1f293d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        h2 { margin-top: 0; color: #f3f4f6; font-size: 20px; }
        label { display: block; margin-top: 12px; font-size: 12px; color: #9ca3af; font-weight: bold; text-transform: uppercase; }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background-color: #0b0f19;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }
        input:focus, select:focus { border-color: #6366f1; outline: none; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            font-size: 14px;
            color: #d1d5db;
        }
        .checkbox-group input { width: auto; margin: 0; }
        .btn-group { display: flex; gap: 10px; margin-top: 25px; }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-update { background-color: #4f46e5; }
        .btn-stop { background-color: #ef4444; }
        button:hover { opacity: 0.9; }
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            background: #0b0f19;
            border: 1px solid #1f293d;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>✏️ Chỉnh sửa RPC</h2>
            
            <label>Discord User Token *</label>
            <input type="password" id="token" placeholder="Dán token Discord của bạn vào đây">

            <label>Tên RPC (Name) *</label>
            <input type="text" id="appName" value="Raceit">

            <label>Loại hoạt động</label>
            <select id="activityType">
                <option value="0">Playing (Đang chơi)</option>
                <option value="1">Streaming (Đang phát trực tiếp)</option>
                <option value="2">Listening (Đang nghe)</option>
                <option value="3">Watching (Đang xem)</option>
                <option value="5" selected>Competing (Đang thi đấu)</option>
            </select>

            <label>Application ID</label>
            <input type="text" id="appId" value="137950502278514708">

            <label>Details (Dòng 1)</label>
            <input type="text" id="details" value="Team Navy Tadaski">

            <label>State (Dòng 2)</label>
            <input type="text" id="state" value="Đang Bắn Giải Trong Bloxstrike">

            <div class="row">
                <div>
                    <label>Large Image URL</label>
                    <!-- Sử dụng link ảnh trực tiếp dạng công khai -->
                    <input type="text" id="largeImage" value="https://i.imgur.com/w1oU9Qn.png" placeholder="URL hình ảnh lớn">
                </div>
                <div>
                    <label>Large Text</label>
                    <input type="text" id="largeText" value="Raceit Logo">
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Small Image URL</label>
                    <input type="text" id="smallImage" placeholder="URL hình ảnh nhỏ">
                </div>
                <div>
                    <label>Small Text</label>
                    <input type="text" id="smallText" placeholder="nova">
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Button 1 Label</label>
                    <input type="text" id="btn1Label" value="zyo">
                </div>
                <div>
                    <label>Button 1 URL</label>
                    <input type="text" id="btn1Url" value="https://zyo.lol">
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Button 2 Label</label>
                    <input type="text" id="btn2Label" value="Discord">
                </div>
                <div>
                    <label>Button 2 URL</label>
                    <input type="text" id="btn2Url" value="https://discord.gg">
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="showTimestamp" checked>
                <label for="showTimestamp" style="display:inline; margin:0; cursor:pointer;">Hiển thị thời gian elapsed</label>
            </div>

            <div class="btn-group">
                <button class="btn-update" onclick="startRPC()">💾 Cập nhật</button>
                <button class="btn-stop" onclick="stopRPC()">⏹ Dừng lại</button>
            </div>

            <div id="status" style="color: #9ca3af;" class="status-box">Trạng thái: Chưa kết nối</div>
        </div>
    </div>

    <script>
        let ws = null;
        let heartbeatInterval = null;

        function startRPC() {
            const token = document.getElementById('token').value.trim();
            const appName = document.getElementById('appName').value;
            const activityType = parseInt(document.getElementById('activityType').value);
            const appId = document.getElementById('appId').value;
            const details = document.getElementById('details').value;
            const state = document.getElementById('state').value;
            const largeImage = document.getElementById('largeImage').value;
            const largeText = document.getElementById('largeText').value;
            const smallImage = document.getElementById('smallImage').value;
            const smallText = document.getElementById('smallText').value;
            const btn1Label = document.getElementById('btn1Label').value;
            const btn1Url = document.getElementById('btn1Url').value;
            const btn2Label = document.getElementById('btn2Label').value;
            const btn2Url = document.getElementById('btn2Url').value;
            const showTimestamp = document.getElementById('showTimestamp').checked;
            const statusBox = document.getElementById('status');

            if (!token) {
                statusBox.style.color = '#ef4444';
                statusBox.innerText = 'Lỗi: Vui lòng nhập Discord Token!';
                return;
            }

            if (ws) {
                ws.close();
                clearInterval(heartbeatInterval);
            }

            statusBox.style.color = '#f59e0b';
            statusBox.innerText = 'Đang kết nối tới cổng WebSocket Discord...';

            ws = new WebSocket('wss://gateway.discord.gg/?v=9&encoding=json');

            ws.onmessage = function(event) {
                const message = JSON.parse(event.data);
                const { op, d } = message;

                if (op === 10) {
                    const interval = d.heartbeat_interval;
                    
                    ws.send(JSON.stringify({
                        op: 2,
                        d: {
                            token: token,
                            properties: { os: "Windows", browser: "Chrome", device: "" }
                        }
                    }));

                    heartbeatInterval = setInterval(() => {
                        ws.send(JSON.stringify({ op: 1, d: null }));
                    }, interval);

                    let activityPayload = {
                        name: appName,
                        type: activityType,
                        details: details || undefined,
                        state: state || undefined,
                        application_id: appId || undefined
                    };

                    if (showTimestamp) {
                        activityPayload.timestamps = { start: Math.floor(Date.now() / 1000) };
                    }

                    if (largeImage || smallImage) {
                        activityPayload.assets = {};
                        if (largeImage) {
                            activityPayload.assets.large_image = largeImage;
                            if (largeText) activityPayload.assets.large_text = largeText;
                        }
                        if (smallImage) {
                            activityPayload.assets.small_image = smallImage;
                            if (smallText) activityPayload.assets.small_text = smallText;
                        }
                    }

                    let buttons = [];
                    if (btn1Label && btn1Url) buttons.push(btn1Label);
                    if (btn2Label && btn2Url) buttons.push(btn2Label);
                    
                    if (buttons.length > 0) {
                        activityPayload.buttons = buttons;
                        activityPayload.metadata = {
                            button_urls: [btn1Url, btn2Url].filter((_, i) => buttons[i])
                        };
                    }

                    setTimeout(() => {
                        ws.send(JSON.stringify({
                            op: 3,
                            d: {
                                since: Date.now(),
                                activities: [activityPayload],
                                status: "online",
                                afk: false
                            }
                        }));
                        statusBox.style.color = '#10b981';
                        statusBox.innerText = 'Cập nhật thành công! Ảnh và trạng thái đã hiện lên chuẩn xác.';
                    }, 1500);
                }
            };

            ws.onerror = function() {
                statusBox.style.color = '#ef4444';
                statusBox.innerText = 'Lỗi kết nối WebSocket hoặc Token không hợp lệ!';
            };
        }

        function stopRPC() {
            const statusBox = document.getElementById('status');
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    op: 3,
                    d: {
                        since: Date.now(),
                        activities: [],
                        status: "online",
                        afk: false
                    }
                }));

                setTimeout(() => {
                    ws.close();
                    clearInterval(heartbeatInterval);
                    ws = null;
                    statusBox.style.color = '#ef4444';
                    statusBox.innerText = 'Đã dừng và xóa trạng thái trên Discord.';
                }, 300);
            } else {
                statusBox.style.color = '#ef4444';
                statusBox.innerText = 'RPC đang không chạy hoặc chưa kết nối.';
            }
        }
    </script>
</body>
</html>
